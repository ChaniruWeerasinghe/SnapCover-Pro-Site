<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist YT Thumbnail Grabber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-6 md:p-12">

    <main class="w-full max-w-2xl space-y-10">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-semibold tracking-tight">Thumbnail Grabber</h1>
            <p class="text-zinc-500 text-sm">Paste a YouTube URL to process and download assets.</p>
        </div>

        <div class="relative">
            <input 
                id="urlInput" 
                type="text" 
                placeholder="https://youtube.com/watch?v=..." 
                class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl px-5 py-4 focus:outline-none focus:ring-1 focus:ring-zinc-600 transition placeholder:text-zinc-700 text-sm"
            >
            <button 
                id="processBtn"
                onclick="processUrl()"
                class="absolute right-2 top-2 bottom-2 px-6 bg-white text-black text-xs font-semibold rounded-lg hover:bg-zinc-200 transition"
            >
                Process
            </button>
        </div>

        <div id="progressArea" class="hidden space-y-2">
            <div class="flex justify-between text-[10px] uppercase tracking-widest text-zinc-500">
                <span>Processing</span>
                <span id="progressText">0%</span>
            </div>
            <div class="h-1 w-full bg-zinc-900 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-white w-0 transition-all duration-500"></div>
            </div>
        </div>

        <div id="results" class="hidden space-y-6 animate-in fade-in duration-700">
            <div id="previewCard" class="glass p-6 rounded-2xl flex flex-col items-center">
                <div class="relative w-full max-w-lg mb-6 group">
                     <img id="previewImg" src="" class="w-full rounded-lg shadow-2xl object-cover aspect-video bg-zinc-900 border border-zinc-800" alt="Thumbnail Preview">
                     <div class="absolute inset-0 rounded-lg shadow-[inset_0_0_20px_rgba(0,0,0,0.5)] pointer-events-none"></div>
                </div>
                
                <div class="w-full max-w-lg text-left mb-3 pl-1">
                    <h3 class="text-sm font-medium text-zinc-300">Download Options</h3>
                </div>
                <div id="downloadGrid" class="w-full max-w-lg grid grid-cols-2 gap-3">
                    <!-- Buttons injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        async function processUrl() {
            const input = document.getElementById('urlInput').value.trim();
            // Comprehensive regex for various YouTube URL formats
            const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/gi;
            const match = reg.exec(input);
            const id = (match && match[1]) ? match[1] : null;

            if (!id) {
                alert("Please enter a valid YouTube video URL."); // Basic fallback, user wanted minimalist so keeping it simple
                return;
            }

            const progressArea = document.getElementById('progressArea');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const results = document.getElementById('results');
            
            progressArea.classList.remove('hidden');
            results.classList.add('hidden');
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            // Simulate processing for visual feedback
            for(let i = 0; i <= 100; i+=25) {
                await new Promise(r => setTimeout(r, 150));
                progressBar.style.width = `${i}%`;
                progressText.innerText = `${i}%`;
            }

            // Hide progress and show results
            setTimeout(() => {
                progressArea.classList.add('hidden');
                document.getElementById('previewImg').src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
                renderButtons(id);
                results.classList.remove('hidden');
            }, 300);
        }

        function renderButtons(id) {
            const grid = document.getElementById('downloadGrid');
            grid.innerHTML = '';
            const qualities = [
                { label: 'Max Res (HD)', key: 'maxresdefault' },
                { label: 'High Quality', key: 'hqdefault' },
                { label: 'Medium Quality', key: 'mqdefault' },
                { label: 'Standard', key: 'default' }
            ];

            qualities.forEach(q => {
                const url = `https://img.youtube.com/vi/${id}/${q.key}.jpg`;
                const btn = document.createElement('button');
                btn.className = 'glass py-3 px-4 flex items-center justify-between rounded-xl text-xs hover:bg-zinc-800 hover:border-zinc-600 transition group';
                
                // Constructing button content with an icon
                btn.innerHTML = `
                    <span class="font-medium text-zinc-300 group-hover:text-white transition">${q.label}</span>
                    <svg class="w-4 h-4 text-zinc-500 group-hover:text-zinc-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                `;
                
                btn.onclick = () => downloadImage(url, `youtube_thumbnail_${id}_${q.key}.jpg`);
                grid.appendChild(btn);
            });
        }

        async function downloadImage(url, filename) {
            try {
                // Fetch the image as a blob to bypass basic cross-origin download restrictions
                // Note: YouTube's image server usually allows this, but if CORS fails, 
                // the fallback is opening in a new tab.
                const response = await fetch(url, { mode: 'cors' });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename; // This attribute prompts the "Save As" dialogue
                document.body.appendChild(link);
                link.click();
                
                // Cleanup
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.warn('CORS fetch failed, falling back to direct link.', error);
                // Fallback: Open in new tab if fetch fails due to CORS
                // The user will have to right-click -> Save Image As...
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
